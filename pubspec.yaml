name: thai_otop_marketplace
description: "Thai OTOP Marketplace — แพลตฟอร์มค้นพบสินค้าและเรื่องราวจากผู้ประกอบการ OTOP ทั่วประเทศไทย"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ฟอนต์ไอคอน iOS — จำเป็นเพราะ page transition ของ iOS ใช้ CupertinoIcons
  cupertino_icons: ^1.0.8

  # --- Cloud backend (ข้อกำหนด: ต้องใช้ Cloud Database) ---
  firebase_core: ^4.15.0          # ตัวเริ่มต้น Firebase SDK
  firebase_auth: ^6.7.0           # ระบบสมาชิก: สมัคร / ล็อกอิน / รีเซ็ตรหัสผ่าน
  cloud_firestore: ^6.10.0        # Cloud Database: สินค้า ร้าน ออเดอร์ แชท คูปอง

  # --- เก็บรูปภาพ ---
  # ไม่ใช้ Firebase Storage เพราะต้องผูกบัตรเครดิต (Cloud Storage for Firebase
  # ใช้ได้เฉพาะแผน Blaze) จึงย้ายไปใช้ Cloudinary free tier แทน
  # ถ้าภายหลังอยากย้ายกลับ: ใส่ firebase_storage กลับในบรรทัดนี้
  http: ^1.2.2                    # ยิง REST API ไป Cloudinary
  crypto: ^3.0.6                  # คำนวณ SHA-1 signature (ตอน dev เท่านั้น)


  # --- Localization ---
  # เหตุผล: แอปเป็น Thai-first ต้องแสดงวันที่/ตัวเลข/วันในสัปดาห์เป็นภาษาไทย
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # --- State management & routing ---
  flutter_riverpod: ^3.4.3        # DI + จัดการ state (แทน setState ทั่วแอป)
  go_router: ^18.0.1              # declarative routing + redirect ตาม role

  # --- UI / performance ---
  cached_network_image: ^4.0.2    # cache รูปสินค้า ลดการโหลดซ้ำตอนเลื่อน list
  equatable: ^3.0.0               # เปรียบเทียบ state แบบ value equality

  # --- Device ---
  image_picker: ^1.2.3            # เลือกรูปจากเครื่อง/กล้อง (สินค้า + แชท)
  cross_file: ^0.3.5+4            # ชนิดไฟล์ข้ามแพลตฟอร์ม (Android/iOS/Web) ใช้ร่วมกับ image_picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ขับแอปจริงบน emulator ตัดสินใจกับ Firestore ของจริง (test/integration)
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
