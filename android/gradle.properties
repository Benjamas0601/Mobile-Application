# -Duser.language/country: บังคับ Gregorian calendar
#   ถ้าไม่บังคับ Windows ภาษาไทยจะให้ BuddhistCalendar -> YEAR=2569
#   ซึ่งเกินช่วง MS-DOS (1980-2107) ทำให้ :app:mergeDebugJavaResource
#   ล้มด้วย VerifyException (no error message)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
# Gradle ต้องรันบน JDK 17 — JDK 23 (Oracle) ทำให้ Kotlin compile หา java.lang.* ไม่เจอ
org.gradle.java.home=C:/Program Files/Microsoft/jdk-17.0.20.101-hotspot
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ชั่วคราว (งานย้ายโปรเจกต์): ปิด Kotlin incremental เลี่ยง bug "Storage already registered" (Kotlin 2.x)
kotlin.incremental=false
